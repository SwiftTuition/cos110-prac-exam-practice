<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 333" width="640" height="333" role="img" aria-label="A flowchart that puts code in its nodes"><title>A flowchart that puts code in its nodes</title><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="640" height="333" fill="#ffffff"/><path d="M210.0,101.0 L210.0,131.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,246.0 L210.0,276.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><ellipse cx="210.0" cy="59.5" rx="125.0" ry="41.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="45.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">countAbove(</text><text xml:space="preserve" x="210.0" y="64.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">const int* values,</text><text xml:space="preserve" x="210.0" y="83.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">int size, int limit)</text><rect x="85.0" y="131.0" width="250.0" height="115.0" rx="0" fill="#fde8e8" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="155.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">if (values == NULL || size &lt;=</text><text xml:space="preserve" x="210.0" y="174.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">0) return 0; int count = 0; for</text><text xml:space="preserve" x="210.0" y="193.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">(int i = 0; i &lt; size; i++) if</text><text xml:space="preserve" x="210.0" y="212.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">(values[i] &gt; limit) count++;</text><text xml:space="preserve" x="210.0" y="231.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">return count;</text><rect x="85.0" y="276.0" width="250.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="300.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text></svg>
