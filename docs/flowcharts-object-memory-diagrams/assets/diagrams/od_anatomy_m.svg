<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="The parts of an object box"><title>The parts of an object box</title><defs></defs><rect x="0" y="0" width="400" height="400" fill="#ffffff"/><path d="M200.0,23.0 L200.0,82.3 L178.0,82.3" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M200.0,117.0 L178.0,117.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M200.0,186.7 L189.0,186.7 L189.0,136.0 L178.0,136.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M200.0,270.0 L200.0,282.8 L178.0,282.8" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M200.0,332.0 L200.0,364.9 L178.0,364.9" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="6.0" y="70.0" width="172.0" height="95.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="92.0" y="90.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle" text-decoration="underline">stages[0]: Stage</text><line x1="6.0" y1="100.0" x2="178.0" y2="100.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="14.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">name = &quot;Main&quot;</text><text xml:space="preserve" x="14.0" y="141.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">acts = Act[2]</text><text xml:space="preserve" x="14.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">numActs = 2</text><rect x="6.0" y="268.0" width="172.0" height="114.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="92.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle" text-decoration="underline">acts[0]: Act</text><line x1="6.0" y1="298.0" x2="178.0" y2="298.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="14.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">name = &quot;Brass Band&quot;</text><text xml:space="preserve" x="14.0" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">minutes = 45</text><text xml:space="preserve" x="14.0" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">id = 1</text><text xml:space="preserve" x="14.0" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start" text-decoration="underline">actCount = 3</text><polygon points="200.0,8.0 382.0,8.0 394.0,20.0 394.0,77.0 200.0,77.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="8.0" x2="382.0" y2="20.0" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="20.0" x2="394.0" y2="20.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1. Name compartment:</text><text xml:space="preserve" x="208.0" y="47.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">object name, colon,</text><text xml:space="preserve" x="208.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">class name, underlined</text><polygon points="200.0,87.0 382.0,87.0 394.0,99.0 394.0,156.0 200.0,156.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="87.0" x2="382.0" y2="99.0" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="99.0" x2="394.0" y2="99.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208.0" y="107.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2. One slot per</text><text xml:space="preserve" x="208.0" y="126.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">member: attr = value,</text><text xml:space="preserve" x="208.0" y="145.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">as in code</text><polygon points="200.0,166.0 382.0,166.0 394.0,178.0 394.0,235.0 200.0,235.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="166.0" x2="382.0" y2="178.0" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="178.0" x2="394.0" y2="178.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208.0" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">3. A pointer to an</text><text xml:space="preserve" x="208.0" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">array shows the type</text><text xml:space="preserve" x="208.0" y="224.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">and size</text><polygon points="200.0,317.0 382.0,317.0 394.0,329.0 394.0,386.0 200.0,386.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="317.0" x2="382.0" y2="329.0" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="329.0" x2="394.0" y2="329.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208.0" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">4. A static member is</text><text xml:space="preserve" x="208.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">underlined: one value</text><text xml:space="preserve" x="208.0" y="375.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">for the whole class</text><polygon points="200.0,255.0 382.0,255.0 394.0,267.0 394.0,305.0 200.0,305.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="255.0" x2="382.0" y2="267.0" stroke="#1f2933" stroke-width="1.6"/><line x1="382.0" y1="267.0" x2="394.0" y2="267.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208.0" y="275.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">5. Array elements are</text><text xml:space="preserve" x="208.0" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">named by their index</text></svg>
