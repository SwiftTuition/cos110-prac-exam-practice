<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Flowchart symbols used in COS 110"><title>Flowchart symbols used in COS 110</title><defs></defs><rect x="0" y="0" width="640" height="330" fill="#ffffff"/><ellipse cx="106.5" cy="54.0" rx="95.0" ry="22.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="106.5" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">printBinary(int n)</text><text xml:space="preserve" x="106.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Start: the function name</text><text xml:space="preserve" x="106.5" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">and its parameter list</text><rect x="224.5" y="34.5" width="190.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="319.5" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="319.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">End: one END for the whole</text><text xml:space="preserve" x="319.5" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">chart</text><rect x="437.5" y="34.5" width="190.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="532.5" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Add 1 to count</text><text xml:space="preserve" x="532.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Process: one action, in</text><text xml:space="preserve" x="532.5" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">words</text><rect x="11.5" y="194.5" width="190.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><line x1="23.5" y1="194.5" x2="23.5" y2="233.5" stroke="#1f2933" stroke-width="1.6"/><line x1="189.5" y1="194.5" x2="189.5" y2="233.5" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="106.5" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">printBinary(n / 2)</text><text xml:space="preserve" x="106.5" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Predefined process: a call</text><text xml:space="preserve" x="106.5" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">to a function (here the</text><text xml:space="preserve" x="106.5" y="312.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">recursive call)</text><polygon points="236.5,194.5 414.5,194.5 402.5,233.5 224.5,233.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="319.5" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">print n</text><text xml:space="preserve" x="319.5" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Input or output: print or</text><text xml:space="preserve" x="319.5" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">read</text><polygon points="532.5,179.0 627.5,214.0 532.5,249.0 437.5,214.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="532.5" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is n 1 or less?</text><text xml:space="preserve" x="532.5" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Decision: a question with</text><text xml:space="preserve" x="532.5" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">a Yes exit and a No exit</text></svg>
