<line x1="97.0" y1="233.0" x2="97.0" y2="291.0" stroke="#1f2933" stroke-width="1.6"/><line x1="323.0" y1="233.0" x2="323.0" y2="291.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="257.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">free the old memory, as the</text><text xml:space="preserve" x="210.0" y="276.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">destructor does</text><rect x="85.0" y="321.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="345.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">copy title and numStages from</text><text xml:space="preserve" x="210.0" y="364.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">other</text><rect x="85.0" y="409.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="433.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">allocate a new stages array of</text><text xml:space="preserve" x="210.0" y="452.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">size numStages</text><rect x="85.0" y="497.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="521.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set i to 0</text><polygon points="210.0,566.0 345.0,602.0 210.0,638.0 75.0,602.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="597.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is i less than</text><text xml:space="preserve" x="210.0" y="616.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">numStages?</text><rect x="75.0" y="668.0" width="270.0" height="77.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="692.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">make a new Stage that copies</text><text xml:space="preserve" x="210.0" y="711.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">other's Stage at index i, and</text><text xml:space="preserve" x="210.0" y="730.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">store it at index i</text><rect x="85.0" y="775.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="799.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">add 1 to i</text><rect x="85.0" y="844.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="868.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">copy numSponsors from other</text><rect x="85.0" y="913.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="937.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">allocate a new sponsors array</text><text xml:space="preserve" x="210.0" y="956.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">of size numSponsors</text><rect x="85.0" y="1001.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1025.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set i to 0</text><polygon points="210.0,1070.0 345.0,1106.0 210.0,1142.0 75.0,1106.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1101.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is i less than</text><text xml:space="preserve" x="210.0" y="1120.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">numSponsors?</text><rect x="85.0" y="1172.0" width="250.0" height="77.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1196.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">store other's sponsor pointer</text><text xml:space="preserve" x="210.0" y="1215.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">at index i (the same Sponsor</text><text xml:space="preserve" x="210.0" y="1234.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">object)</text><rect x="85.0" y="1279.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1303.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">add 1 to i</text><rect x="85.0" y="1348.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1372.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">return a reference to this</text><text xml:space="preserve" x="210.0" y="1391.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">festival</text><rect x="85.0" y="1436.0" width="250.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1460.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="351.0" y="150.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="218.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text><text xml:space="preserve" x="218.0" y="654.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="351.0" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text><text xml:space="preserve" x="218.0" y="1158.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="351.0" y="1099.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text></svg>
