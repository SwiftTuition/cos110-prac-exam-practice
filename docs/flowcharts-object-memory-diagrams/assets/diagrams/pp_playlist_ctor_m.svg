<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 910" width="400" height="910" role="img" aria-label="Figure 3, redrawn: the constructor flowchart (phone)"><title>Figure 3, redrawn: the constructor flowchart (phone)</title><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="400" height="910" fill="#ffffff"/><path d="M158.0,116.0 L158.0,146.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,237.0 L158.0,267.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M274.0,191.5 L385.0,191.5 L385.0,876.5 L264.0,876.5" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,306.0 L158.0,336.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,375.0 L158.0,405.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,482.0 L158.0,512.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,570.0 L158.0,600.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,670.0 L158.0,700.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,758.0 L158.0,788.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M52.0,807.5 L18.0,807.5 L18.0,635.0 L42.0,635.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M274.0,635.0 L290.0,635.0 L290.0,876.5 L264.0,876.5" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><ellipse cx="158.0" cy="65.0" rx="160.0" ry="51.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">anonymousConstructor</text><text xml:space="preserve" x="158.0" y="60.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">(std::string n,</text><text xml:space="preserve" x="158.0" y="79.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">const std::string* source,</text><text xml:space="preserve" x="158.0" y="98.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">int count)</text><polygon points="158.0,146.0 274.0,191.5 158.0,237.0 42.0,191.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="177.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">is source valid</text><text xml:space="preserve" x="158.0" y="196.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">and count</text><text xml:space="preserve" x="158.0" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">positive?</text><rect x="52.0" y="267.0" width="212.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="291.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set title to n</text><rect x="52.0" y="336.0" width="212.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="360.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set songCount to count</text><rect x="52.0" y="405.0" width="212.0" height="77.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="429.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">allocate memory for songs</text><text xml:space="preserve" x="158.0" y="448.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">that is the same size as</text><text xml:space="preserve" x="158.0" y="467.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">songCount</text><rect x="52.0" y="512.0" width="212.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="536.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">initialise k to one less</text><text xml:space="preserve" x="158.0" y="555.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">than songCount</text><polygon points="158.0,600.0 274.0,635.0 158.0,670.0 42.0,635.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="640.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">is k more than 0?</text><rect x="52.0" y="700.0" width="212.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="724.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set songs at k to whatever</text><text xml:space="preserve" x="158.0" y="743.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">source at k is</text><rect x="52.0" y="788.0" width="212.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="812.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">decrement k</text><rect x="52.0" y="857.0" width="212.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="881.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="166.0" y="253.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="280.0" y="184.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text><text xml:space="preserve" x="166.0" y="686.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="280.0" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text></svg>
