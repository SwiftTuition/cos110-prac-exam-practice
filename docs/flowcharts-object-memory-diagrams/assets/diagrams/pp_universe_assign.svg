<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1134" width="640" height="1134" role="img" aria-label="Flowchart of the Universe assignment operator"><title>Flowchart of the Universe assignment operator</title><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="640" height="1134" fill="#ffffff"/><path d="M210.0,82.0 L210.0,112.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M345.0,157.5 L560.0,157.5 L560.0,1018.0 L335.0,1018.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,203.0 L210.0,233.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,329.0 L210.0,359.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,398.0 L210.0,428.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,486.0 L210.0,516.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,555.0 L210.0,585.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,657.0 L210.0,687.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,783.0 L210.0,813.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M85.0,832.5 L36.0,832.5 L36.0,621.0 L75.0,621.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M345.0,621.0 L470.0,621.0 L470.0,920.5 L335.0,920.5" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,959.0 L210.0,989.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M210.0,1047.0 L210.0,1077.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><ellipse cx="210.0" cy="50.0" rx="125.0" ry="32.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="45.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">operator=(const Universe&amp;</text><text xml:space="preserve" x="210.0" y="64.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">other)</text><polygon points="210.0,112.0 345.0,157.5 210.0,203.0 75.0,157.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is other the same</text><text xml:space="preserve" x="210.0" y="162.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">object as this</text><text xml:space="preserve" x="210.0" y="181.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">universe?</text><rect x="85.0" y="233.0" width="250.0" height="96.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="257.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">free the old memory, as the</text><text xml:space="preserve" x="210.0" y="276.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">destructor does: each Galaxy,</text><text xml:space="preserve" x="210.0" y="295.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">the galaxies array and the</text><text xml:space="preserve" x="210.0" y="314.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">stars array</text><rect x="85.0" y="359.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="383.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">copy numGalaxies from other</text><rect x="85.0" y="428.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="452.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">allocate a new galaxies array</text><text xml:space="preserve" x="210.0" y="471.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">of size numGalaxies</text><rect x="85.0" y="516.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="540.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set i to 0</text><polygon points="210.0,585.0 345.0,621.0 210.0,657.0 75.0,621.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="616.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is i less than</text><text xml:space="preserve" x="210.0" y="635.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">numGalaxies?</text><rect x="75.0" y="687.0" width="270.0" height="96.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="711.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">make a new Galaxy that copies</text><text xml:space="preserve" x="210.0" y="730.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">other's Galaxy at index i (with</text><text xml:space="preserve" x="210.0" y="749.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">its own stars), and store it at</text><text xml:space="preserve" x="210.0" y="768.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">index i</text><rect x="85.0" y="813.0" width="250.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="837.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">add 1 to i</text><rect x="85.0" y="882.0" width="250.0" height="77.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><line x1="97.0" y1="882.0" x2="97.0" y2="959.0" stroke="#1f2933" stroke-width="1.6"/><line x1="323.0" y1="882.0" x2="323.0" y2="959.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="906.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">updateStarsArray(): fill a</text><text xml:space="preserve" x="210.0" y="925.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">new stars array from this</text><text xml:space="preserve" x="210.0" y="944.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">universe's galaxies</text><rect x="85.0" y="989.0" width="250.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1013.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">return a reference to this</text><text xml:space="preserve" x="210.0" y="1032.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">universe</text><rect x="85.0" y="1077.0" width="250.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="210.0" y="1101.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="351.0" y="150.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="218.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text><text xml:space="preserve" x="218.0" y="673.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="351.0" y="614.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text></svg>
