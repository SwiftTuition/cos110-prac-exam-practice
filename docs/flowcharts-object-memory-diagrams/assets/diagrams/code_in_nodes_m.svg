<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" width="400" height="344" role="img" aria-label="A flowchart that puts code in its nodes (phone)"><title>A flowchart that puts code in its nodes (phone)</title><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="400" height="344" fill="#ffffff"/><path d="M158.0,97.0 L158.0,127.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,261.0 L158.0,291.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><ellipse cx="158.0" cy="55.5" rx="106.0" ry="41.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">countAbove(</text><text xml:space="preserve" x="158.0" y="60.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">const int* values,</text><text xml:space="preserve" x="158.0" y="79.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">int size, int limit)</text><rect x="52.0" y="127.0" width="212.0" height="134.0" rx="0" fill="#fde8e8" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="151.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">if (values == NULL || size</text><text xml:space="preserve" x="158.0" y="170.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">&lt;= 0) return 0; int count</text><text xml:space="preserve" x="158.0" y="189.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">= 0; for (int i = 0; i &lt;</text><text xml:space="preserve" x="158.0" y="208.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">size; i++) if (values[i] &gt;</text><text xml:space="preserve" x="158.0" y="227.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">limit) count++; return</text><text xml:space="preserve" x="158.0" y="246.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">count;</text><rect x="52.0" y="291.0" width="212.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="315.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text></svg>
