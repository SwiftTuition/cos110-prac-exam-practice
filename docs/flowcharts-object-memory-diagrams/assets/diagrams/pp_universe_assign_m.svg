<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1183" width="400" height="1183" role="img" aria-label="Flowchart of the Universe assignment operator (phone)"><title>Flowchart of the Universe assignment operator (phone)</title><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="400" height="1183" fill="#ffffff"/><path d="M158.0,78.0 L158.0,108.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M274.0,153.5 L375.0,153.5 L375.0,1071.0 L264.0,1071.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,199.0 L158.0,229.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,325.0 L158.0,355.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,413.0 L158.0,443.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,501.0 L158.0,531.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,570.0 L158.0,600.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,672.0 L158.0,702.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,817.0 L158.0,847.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M52.0,866.5 L18.0,866.5 L18.0,636.0 L42.0,636.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M274.0,636.0 L316.0,636.0 L316.0,964.0 L264.0,964.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,1012.0 L158.0,1042.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><path d="M158.0,1100.0 L158.0,1130.0" fill="none" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah1f2933)"/><ellipse cx="158.0" cy="46.0" rx="106.0" ry="32.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="41.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">operator=(const</text><text xml:space="preserve" x="158.0" y="60.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Universe&amp; other)</text><polygon points="158.0,108.0 274.0,153.5 158.0,199.0 42.0,153.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="139.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is other the same</text><text xml:space="preserve" x="158.0" y="158.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">object as this</text><text xml:space="preserve" x="158.0" y="177.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">universe?</text><rect x="52.0" y="229.0" width="212.0" height="96.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="253.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">free the old memory, as</text><text xml:space="preserve" x="158.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">the destructor does: each</text><text xml:space="preserve" x="158.0" y="291.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Galaxy, the galaxies array</text><text xml:space="preserve" x="158.0" y="310.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">and the stars array</text><rect x="52.0" y="355.0" width="212.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">copy numGalaxies from</text><text xml:space="preserve" x="158.0" y="398.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">other</text><rect x="52.0" y="443.0" width="212.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="467.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">allocate a new galaxies</text><text xml:space="preserve" x="158.0" y="486.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">array of size numGalaxies</text><rect x="52.0" y="531.0" width="212.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="555.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">set i to 0</text><polygon points="158.0,600.0 274.0,636.0 158.0,672.0 42.0,636.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="631.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is i less than</text><text xml:space="preserve" x="158.0" y="650.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">numGalaxies?</text><rect x="52.0" y="702.0" width="212.0" height="115.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="726.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">make a new Galaxy that</text><text xml:space="preserve" x="158.0" y="745.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">copies other's Galaxy at</text><text xml:space="preserve" x="158.0" y="764.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">index i (with its own</text><text xml:space="preserve" x="158.0" y="783.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">stars), and store it at</text><text xml:space="preserve" x="158.0" y="802.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">index i</text><rect x="52.0" y="847.0" width="212.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="871.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">add 1 to i</text><rect x="52.0" y="916.0" width="212.0" height="96.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><line x1="64.0" y1="916.0" x2="64.0" y2="1012.0" stroke="#1f2933" stroke-width="1.6"/><line x1="252.0" y1="916.0" x2="252.0" y2="1012.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="940.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">updateStarsArray():</text><text xml:space="preserve" x="158.0" y="959.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">fill a new stars array</text><text xml:space="preserve" x="158.0" y="978.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">from this universe's</text><text xml:space="preserve" x="158.0" y="997.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">galaxies</text><rect x="52.0" y="1042.0" width="212.0" height="58.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="1066.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">return a reference to this</text><text xml:space="preserve" x="158.0" y="1085.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">universe</text><rect x="52.0" y="1130.0" width="212.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="158.0" y="1154.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="280.0" y="146.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="166.0" y="215.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text><text xml:space="preserve" x="166.0" y="688.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Yes</text><text xml:space="preserve" x="280.0" y="629.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">No</text></svg>
