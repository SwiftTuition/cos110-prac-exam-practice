<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="720" height="428" role="img" aria-label="The parts of an object box"><title>The parts of an object box</title><defs></defs><rect x="0" y="0" width="720" height="428" fill="#ffffff"/><path d="M280.0,23.0 L280.0,82.3 L222.0,82.3" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M280.0,117.0 L222.0,117.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M280.0,187.0 L252.0,187.0 L252.0,136.0 L222.0,136.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M280.0,345.0 L280.0,396.9 L222.0,396.9" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M540.0,300.0 L540.0,314.8 L222.0,314.8" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="12.0" y="70.0" width="210.0" height="95.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="117.0" y="90.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle" text-decoration="underline">stages[0]: Stage</text><line x1="12.0" y1="100.0" x2="222.0" y2="100.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="20.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">name = &quot;Main&quot;</text><text xml:space="preserve" x="20.0" y="141.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">acts = Act[2]</text><text xml:space="preserve" x="20.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">numActs = 2</text><rect x="12.0" y="300.0" width="210.0" height="114.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="117.0" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle" text-decoration="underline">acts[0]: Act</text><line x1="12.0" y1="330.0" x2="222.0" y2="330.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="20.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">name = &quot;Brass Band&quot;</text><text xml:space="preserve" x="20.0" y="371.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">minutes = 45</text><text xml:space="preserve" x="20.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">id = 1</text><text xml:space="preserve" x="20.0" y="409.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start" text-decoration="underline">actCount = 3</text><polygon points="280.0,8.0 468.0,8.0 480.0,20.0 480.0,77.0 280.0,77.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="8.0" x2="468.0" y2="20.0" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="20.0" x2="480.0" y2="20.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="288.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1. Name compartment:</text><text xml:space="preserve" x="288.0" y="47.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">object name, colon,</text><text xml:space="preserve" x="288.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">class name, underlined</text><polygon points="280.0,96.0 468.0,96.0 480.0,108.0 480.0,146.0 280.0,146.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="96.0" x2="468.0" y2="108.0" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="108.0" x2="480.0" y2="108.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="288.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2. One slot per member:</text><text xml:space="preserve" x="288.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">attr = value, as in code</text><polygon points="280.0,172.0 468.0,172.0 480.0,184.0 480.0,222.0 280.0,222.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="172.0" x2="468.0" y2="184.0" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="184.0" x2="480.0" y2="184.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="288.0" y="192.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">3. A pointer to an array</text><text xml:space="preserve" x="288.0" y="211.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">shows the type and size</text><polygon points="280.0,330.0 468.0,330.0 480.0,342.0 480.0,399.0 280.0,399.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="330.0" x2="468.0" y2="342.0" stroke="#1f2933" stroke-width="1.6"/><line x1="468.0" y1="342.0" x2="480.0" y2="342.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="288.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">4. A static member is</text><text xml:space="preserve" x="288.0" y="369.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">underlined: one value</text><text xml:space="preserve" x="288.0" y="388.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">for the whole class</text><polygon points="500.0,250.0 688.0,250.0 700.0,262.0 700.0,300.0 500.0,300.0" fill="#fffbea" stroke="#1f2933" stroke-width="1.6"/><line x1="688.0" y1="250.0" x2="688.0" y2="262.0" stroke="#1f2933" stroke-width="1.6"/><line x1="688.0" y1="262.0" x2="700.0" y2="262.0" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="508.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">5. Array elements are</text><text xml:space="preserve" x="508.0" y="289.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">named by their index</text></svg>
