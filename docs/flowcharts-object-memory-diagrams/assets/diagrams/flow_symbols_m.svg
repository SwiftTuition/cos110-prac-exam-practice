<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" width="400" height="490" role="img" aria-label="Flowchart symbols used in COS 110"><title>Flowchart symbols used in COS 110</title><defs></defs><rect x="0" y="0" width="400" height="490" fill="#ffffff"/><ellipse cx="100.0" cy="54.0" rx="95.0" ry="22.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="100.0" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">printBinary(int n)</text><text xml:space="preserve" x="100.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Start: the function name</text><text xml:space="preserve" x="100.0" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">and its parameter list</text><rect x="205.0" y="34.5" width="190.0" height="39.0" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="300.0" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">END</text><text xml:space="preserve" x="300.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">End: one END for the</text><text xml:space="preserve" x="300.0" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">whole chart</text><rect x="5.0" y="194.5" width="190.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="100.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Add 1 to count</text><text xml:space="preserve" x="100.0" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Process: one action, in</text><text xml:space="preserve" x="100.0" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">words</text><rect x="205.0" y="194.5" width="190.0" height="39.0" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><line x1="217.0" y1="194.5" x2="217.0" y2="233.5" stroke="#1f2933" stroke-width="1.6"/><line x1="383.0" y1="194.5" x2="383.0" y2="233.5" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="300.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">printBinary(n / 2)</text><text xml:space="preserve" x="300.0" y="274.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Predefined process: a</text><text xml:space="preserve" x="300.0" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">call to a function (here</text><text xml:space="preserve" x="300.0" y="312.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">the recursive call)</text><polygon points="17.0,354.5 195.0,354.5 183.0,393.5 5.0,393.5" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="100.0" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">print n</text><text xml:space="preserve" x="100.0" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Input or output: print</text><text xml:space="preserve" x="100.0" y="453.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">or read</text><polygon points="300.0,339.0 395.0,374.0 300.0,409.0 205.0,374.0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="300.0" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">Is n 1 or less?</text><text xml:space="preserve" x="300.0" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">Decision: a question</text><text xml:space="preserve" x="300.0" y="453.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">with a Yes exit and a No</text><text xml:space="preserve" x="300.0" y="472.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">exit</text></svg>
