<text x="28" y="511" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">- title: string</text>
<line x1="20" y1="521" x2="250" y2="521" stroke="#1f2933" stroke-width="1.6"/>
<text x="265" y="326" text-anchor="start" font-size="14" font-weight="bold" fill="#1f2933" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Aggregation:</text>
<text x="265" y="348" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Library only</text>
