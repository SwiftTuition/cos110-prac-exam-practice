<text x="265" y="70" text-anchor="start" font-size="14" font-weight="bold" fill="#1f2933" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Composition:</text>
<text x="265" y="92" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Book owns the</text>
<text x="265" y="111" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="Segoe UI, Arial, sans-serif" xml:space="preserve">Chapters. ~Book</text>
