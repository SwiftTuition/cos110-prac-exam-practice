<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2933" font-weight="bold" text-anchor="start">Minutes into the 90-minute exam</text><text xml:space="preserve" x="16.0" y="50" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">0</text><text xml:space="preserve" x="178.0" y="50" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">30</text><text xml:space="preserve" x="340.0" y="50" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">60</text><text xml:space="preserve" x="502.00000000000006" y="50" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">90</text><line x1="16" y1="56" x2="502.00000000000006" y2="56" stroke="#1f2933" stroke-width="1.2"/><rect x="16.0" y="70" width="54.0" height="26" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="16" y="122" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">0 to 10:  Read all six; choose one A and one B</text><rect x="70.0" y="148" width="216.0" height="26" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="16" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">10 to 50:  First question: 40 minutes</text><rect x="286.0" y="226" width="162.0" height="26" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="16" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">50 to 80:  Second question: 30 minutes</text><rect x="448.0" y="304" width="54.0" height="26" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="16" y="356" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">80 to 90:  Build and check both; hand in</text><text xml:space="preserve" x="16" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">Assumed (from the HRMS practical): building with</text><text xml:space="preserve" x="16" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">make and valgrind, and handing in by uploading</text><text xml:space="preserve" x="16" y="454" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">one 