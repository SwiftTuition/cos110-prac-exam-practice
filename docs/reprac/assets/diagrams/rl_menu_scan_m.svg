<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">A menu with maxSize 5:</text><rect x="16" y="40" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><rect x="62" y="40" width="170" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Garlic bread S</text><text xml:space="preserve" x="242" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="start">F: S: no</text><rect x="16" y="80" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="100" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><rect x="62" y="80" width="170" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Beef burger M</text><text xml:space="preserve" x="242" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">F: M: return a copy</text><rect x="16" y="120" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="140" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><rect x="62" y="120" width="170" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Veg curry M</text><text xml:space="preserve" x="242" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">L: M: return a copy</text><rect x="16" y="160" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="180" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[3]</text><rect x="62" y="160" width="170" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Malva pudding D</text><text xml:space="preserve" x="242" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="start">L: D: no</text><rect x="16" y="200" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="220" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[4]</text><rect x="62" y="200" width="170" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="242" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="start">L: NULL: no</text><text xml:space="preserve" x="16" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">F = findFirst("Main"): i = 0, 1, ... (forwards)</text><text xml:space="preserve" x="16" y="283" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">L = findLast("Main"): i = 4, 3, 2, ... (backwards)</text><text xml:space="preserve" x="16" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">averagePrice and numberAbove / numberBelow /</text><text xml:space="preserve" x="16" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">numberEqual visit every slot (no early return),</text><text xml:space="preserve" x="16" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">then throw if nothing matched.</text><text xml:space="preserve" x="16" y="367" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Every test is</text><text xml:space="preserve" x="16" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">items[i] != NULL &amp;&amp; items[i]-&gt;getType() == code</text><text xml:space="preserve" x="16" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">...: the NULL test comes first.</text></svg>
