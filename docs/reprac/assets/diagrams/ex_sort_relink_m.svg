<svg xmlns="http://www.w3.org/2000/svg" width="400" height="514" viewBox="0 0 400 514"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Insert curr (1000, value 8) into the sorted part</text><rect x="16" y="100" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="71" y="100" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="43.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">11</text><circle cx="88.5" cy="120" r="3.5" fill="#1f2933"/><rect x="146" y="100" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="201" y="100" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="173.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">0101</text><circle cx="218.5" cy="120" r="3.5" fill="#1f2933"/><rect x="276" y="100" width="55" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><rect x="331" y="100" width="35" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="303.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">1000</text><circle cx="348.5" cy="120" r="3.5" fill="#1f2933"/><text xml:space="preserve" x="43" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 3</text><text xml:space="preserve" x="173" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 5</text><text xml:space="preserve" x="303" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 8</text><path d="M88.5,120 L146,120" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><path d="M218.5,120 L276,120" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="247.25" cy="86" r="11" fill="#d9480f"/><text xml:space="preserve" x="247.25" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text xml:space="preserve" x="191.0" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">prev</text><path d="M191.0,66 L191.0,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="321.0" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">curr</text><path d="M321.0,66 L321.0,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="61" y="54" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">sorted</text><path d="M61,60 L61,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><path d="M348.5,120 L348.5,182" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><text xml:space="preserve" x="332.5" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><circle cx="366.5" cy="166" r="11" fill="#d9480f"/><text xml:space="preserve" x="366.5" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text xml:space="preserve" x="16" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">temp keeps the rest of the old list:</text><text xml:space="preserve" x="16" y="295" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">temp</text><path d="M56,290 L84,290" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="86" y="270" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="141" y="270" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="113.5" y="295" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">011</text><circle cx="158.5" cy="290" r="3.5" fill="#1f2933"/><rect x="216" y="270" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="271" y="270" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="243.5" y="295" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">0</text><circle cx="288.5" cy="290" r="3.5" fill="#1f2933"/><path d="M158.5,290 L216,290" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><path d="M288.5,290 L288.5,332" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="272.5" y="350" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="16" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">The walk: prev starts at 11. The next</text><text xml:space="preserve" x="16" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">value, 5, is &lt;= 8, so prev moves to 0101.</text><text xml:space="preserve" x="16" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">prev-&gt;next() is now NULL: the walk stops.</text><text xml:space="preserve" x="16" y="443" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1: curr-&gt;next() = prev-&gt;next();</text><text xml:space="preserve" x="16" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2: prev-&gt;next() = curr;</text><text xml:space="preserve" x="16" y="485" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Then curr = temp moves on to 011.</text></svg>
