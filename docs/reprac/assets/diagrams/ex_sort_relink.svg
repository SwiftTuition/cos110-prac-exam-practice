<svg xmlns="http://www.w3.org/2000/svg" width="660" height="474" viewBox="0 0 660 474"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Insert curr (1000, value 8) into the sorted part</text><rect x="60" y="100" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="115" y="100" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="87.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">11</text><circle cx="132.5" cy="120" r="3.5" fill="#1f2933"/><rect x="220" y="100" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="275" y="100" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="247.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">0101</text><circle cx="292.5" cy="120" r="3.5" fill="#1f2933"/><rect x="380" y="100" width="55" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><rect x="435" y="100" width="35" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="407.5" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">1000</text><circle cx="452.5" cy="120" r="3.5" fill="#1f2933"/><text xml:space="preserve" x="87" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 3</text><text xml:space="preserve" x="247" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 5</text><text xml:space="preserve" x="407" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="middle">value 8</text><path d="M132.5,120 L220,120" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><path d="M292.5,120 L380,120" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="336.25" cy="86" r="11" fill="#d9480f"/><text xml:space="preserve" x="336.25" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text xml:space="preserve" x="265.0" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">prev</text><path d="M265.0,66 L265.0,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="425.0" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">curr</text><path d="M425.0,66 L425.0,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="105" y="54" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="middle">sorted</text><path d="M105,60 L105,98" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><path d="M452.5,120 L452.5,182" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><text xml:space="preserve" x="436.5" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><circle cx="470.5" cy="166" r="11" fill="#d9480f"/><text xml:space="preserve" x="470.5" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text xml:space="preserve" x="16" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">temp keeps the rest of the old list:</text><text xml:space="preserve" x="16" y="275" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">temp</text><path d="M56,270 L84,270" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="86" y="250" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="141" y="250" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="113.5" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">011</text><circle cx="158.5" cy="270" r="3.5" fill="#1f2933"/><rect x="246" y="250" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="301" y="250" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="273.5" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">0</text><circle cx="318.5" cy="270" r="3.5" fill="#1f2933"/><path d="M158.5,270 L246,270" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><path d="M318.5,270 L370,270" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="376" y="275" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="16" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">The walk: prev starts at 11. The next value, 5,</text><text xml:space="preserve" x="16" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">is &lt;= 8, so prev moves to 0101. Then</text><text xml:space="preserve" x="16" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">prev-&gt;next() is NULL, so the walk stops.</text><text xml:space="preserve" x="16" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1: curr-&gt;next() = prev-&gt;next();  (NULL)</text><text xml:space="preserve" x="16" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2: prev-&gt;next() = curr;  links 1000 after 0101</text><text xml:space="preserve" x="16" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Then curr = temp moves on to 011.</text></svg>
