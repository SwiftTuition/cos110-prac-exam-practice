<text x="20" y="734" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">Hollow triangle: inheritance (the class at the other end is derived from the class at the triangle). Orange numbers: the numbered list under the diagram.</text>
<text x="20" y="758" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">Plain line: an association shown on the paper; the paper does not say more. Assumed: Menu uses Item objects, and its functions throw the exception classes.</text>
<text x="20" y="782" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">Not drawn: each class has a friend operator&lt;&lt; (the paper says so). The exam's own headers show virtual and const.</text></svg>
