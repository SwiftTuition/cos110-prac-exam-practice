<text x="20" y="386" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">Dashed box with T: Node is a template.</text>
<text x="20" y="410" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">In Node&lt;Binary&gt;, T is Binary: each node</text>
<text x="20" y="434" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">holds a whole Binary object (data: T,</text>
<text x="20" y="458" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">not T*).</text>
<text x="20" y="496" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">Not drawn: operator&lt;&lt; for Binary and</text>
<text x="20" y="520" text-anchor="start" font-size="16" fill="#4b5563" xml:space="preserve">BinaryStrings (each class has one).</text></svg>
