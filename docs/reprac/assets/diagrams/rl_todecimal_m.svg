<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Binary a("1011");   a.toDecimal(3)</text><rect x="16" y="40" width="56" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start"> 1</text><text xml:space="preserve" x="30" y="92" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[0]</text><rect x="76" y="40" width="56" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="84" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start"> 0</text><text xml:space="preserve" x="90" y="92" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[1]</text><rect x="136" y="40" width="56" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="144" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start"> 1</text><text xml:space="preserve" x="150" y="92" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[2]</text><rect x="196" y="40" width="56" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="204" y="60" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start"> 1</text><text xml:space="preserve" x="210" y="92" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[3]</text><rect x="16" y="112" width="440" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="132" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">toDecimal(3)</text><text xml:space="preserve" x="24" y="152" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">array[3] is 1: 2 * toDecimal(2) + 1</text><text xml:space="preserve" x="24" y="171" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">2 * 5 + 1 = 11</text><path d="M76,178 L88,196" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="28" y="196" width="428" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="36" y="216" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">toDecimal(2)</text><text xml:space="preserve" x="36" y="236" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">array[2] is 1: 2 * toDecimal(1) + 1</text><text xml:space="preserve" x="36" y="255" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">2 * 2 + 1 = 5</text><path d="M88,262 L100,280" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="40" y="280" width="416" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="48" y="300" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">toDecimal(1)</text><text xml:space="preserve" x="48" y="320" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">array[1] is 0: 2 * toDecimal(0)</text><text xml:space="preserve" x="48" y="339" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">2 * 1 = 2</text><path d="M100,346 L112,364" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="52" y="364" width="404" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="60" y="384" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">toDecimal(0)</text><text xml:space="preserve" x="60" y="404" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">array[0] is 1: 2 * toDecimal(-1) + 1</text><text xml:space="preserve" x="60" y="423" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">2 * 0 + 1 = 1</text><path d="M112,430 L124,448" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="64" y="448" width="392" height="66" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="72" y="468" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">toDecimal(-1)</text><text xml:space="preserve" x="72" y="488" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">index &lt; 0: base case</text><text xml:space="preserve" x="72" y="507" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">returns 0</text><text xml:space="preserve" x="16" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Blue: each call waits for the call below it.</text><text xml:space="preserve" x="16" y="569" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Green: the answers come back up, from the bottom:</text><text xml:space="preserve" x="16" y="590" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">0, 1, 2, 5, 11.</text></svg>
