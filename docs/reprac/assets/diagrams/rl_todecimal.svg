<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">toDecimal(3) on 1011: the calls go down, the answers come back up</title><desc id="d">The bits of 1011 at indexes 0 to 3. toDecimal(3) calls toDecimal(2), which calls toDecimal(1), then toDecimal(0), then toDecimal(-1), which is the base case and returns 0. Going back up: toDecimal(0) returns 1, toDecimal(1) returns 2, toDecimal(2) returns 5, toDecimal(3) returns 11.</desc><rect width="820" height="380" fill="#ffffff"/><text x="20" y="26" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Binary a("1011");   a.toDecimal(3)</text>
<rect x="560" y="12" width="50" height="30" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="585" y="32" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">1</text>
<text x="585" y="56" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[0]</text>
<rect x="610" y="12" width="50" height="30" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="635" y="32" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">0</text>
<text x="635" y="56" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[1]</text>
<rect x="660" y="12" width="50" height="30" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="685" y="32" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">1</text>
<text x="685" y="56" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[2]</text>
<rect x="710" y="12" width="50" height="30" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="735" y="32" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">1</text>
<text x="735" y="56" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[3]</text>
<rect x="30" y="80" width="420" height="38" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="40" y="96" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">toDecimal(3)</text>
<text x="40" y="112" text-anchor="start" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">array[3] is 1:  2 * toDecimal(2) + 1</text>
<text x="620" y="104" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#15803d" xml:space="preserve">2 * 5 + 1 = 11</text>
<line x1="70" y1="118" x2="92.94117647058823" y2="130.23529411764707" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="100.0,134.0 91.1,133.8 94.8,126.7" fill="#1d4ed8"/>
<line x1="660" y1="132" x2="660.0" y2="120.0" stroke="#15803d" stroke-width="1.4"/><polygon points="660.0,112.0 664.0,120.0 656.0,120.0" fill="#15803d"/>
<rect x="60" y="134" width="420" height="38" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="70" y="150" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">toDecimal(2)</text>
<text x="70" y="166" text-anchor="start" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">array[2] is 1:  2 * toDecimal(1) + 1</text>
<text x="620" y="158" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#15803d" xml:space="preserve">2 * 2 + 1 = 5</text>
<line x1="100" y1="172" x2="122.94117647058823" y2="184.23529411764707" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="130.0,188.0 121.1,187.8 124.8,180.7" fill="#1d4ed8"/>
<line x1="660" y1="186" x2="660.0" y2="174.0" stroke="#15803d" stroke-width="1.4"/><polygon points="660.0,166.0 664.0,174.0 656.0,174.0" fill="#15803d"/>
<rect x="90" y="188" width="420" height="38" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="100" y="204" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">toDecimal(1)</text>
<text x="100" y="220" text-anchor="start" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">array[1] is 0:  2 * toDecimal(0)</text>
<text x="620" y="212" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#15803d" xml:space="preserve">2 * 1 = 2</text>
<line x1="130" y1="226" x2="152.94117647058823" y2="238.23529411764707" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="160.0,242.0 151.1,241.8 154.8,234.7" fill="#1d4ed8"/>
<line x1="660" y1="240" x2="660.0" y2="228.0" stroke="#15803d" stroke-width="1.4"/><polygon points="660.0,220.0 664.0,228.0 656.0,228.0" fill="#15803d"/>
<rect x="120" y="242" width="420" height="38" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="130" y="258" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">toDecimal(0)</text>
<text x="130" y="274" text-anchor="start" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">array[0] is 1:  2 * toDecimal(-1) + 1</text>
<text x="620" y="266" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#15803d" xml:space="preserve">2 * 0 + 1 = 1</text>
<line x1="160" y1="280" x2="182.94117647058823" y2="292.2352941176471" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="190.0,296.0 181.1,295.8 184.8,288.7" fill="#1d4ed8"/>
<line x1="660" y1="294" x2="660.0" y2="282.0" stroke="#15803d" stroke-width="1.4"/><polygon points="660.0,274.0 664.0,282.0 656.0,282.0" fill="#15803d"/>
<rect x="150" y="296" width="420" height="38" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="160" y="312" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">toDecimal(-1)</text>
<text x="160" y="328" text-anchor="start" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">index &lt; 0: base case</text>
<text x="620" y="320" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#15803d" xml:space="preserve">returns 0</text>
<text x="20" y="364" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">Blue: each call waits for the call below it. Green: the answers come back up, from the bottom: 0, 1, 2, 5, 11.</text></svg>
