<line x1="135" y1="50" x2="135" y2="90" stroke="#1f2937" stroke-width="1.3"/>
<text x="82" y="75" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">maxSize 4</text>
<text x="170" y="75" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">items</text>
<circle cx="215" cy="70" r="3.5" fill="#1f2937"/>
