<text x="30" y="205" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">b itself (maxSize and the items pointer) is a normal variable. new Item*[4] made the array of 4 pointers; each new Item(...) made one item.</text>
<text x="30" y="225" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">~Menu() frees both levels: delete items[i] for each slot (4 deletes, delete NULL does nothing), then delete[] items.</text></svg>
