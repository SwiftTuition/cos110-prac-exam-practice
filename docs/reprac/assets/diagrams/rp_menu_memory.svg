<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 245" width="790" height="245" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">A Menu in memory: an array of Item pointers</title><desc id="d">Menu b with maxSize 4. Its items pointer points to an array of 4 slots. Slots 0, 1 and 2 point to the items Garlic bread, Beef burger and Malva pudding. Slot 3 is NULL.</desc><rect width="790" height="245" fill="#ffffff"/><text x="30" y="42" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Menu b(4);</text>
