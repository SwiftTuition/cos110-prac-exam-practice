<text x="470.0" y="164" text-anchor="middle" font-size="11" fill="#1f2937" xml:space="preserve">M  R120</text>
<line x1="470.0" y1="70.0" x2="470.0" y2="118.0" stroke="#1f2937" stroke-width="1.4"/><polygon points="470.0,126.0 466.0,118.0 474.0,118.0" fill="#1f2937"/>
<rect x="534.0" y="128" width="112" height="46" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
