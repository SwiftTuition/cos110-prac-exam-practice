<rect x="530" y="50" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="590.0" y="44" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[2]</text>
