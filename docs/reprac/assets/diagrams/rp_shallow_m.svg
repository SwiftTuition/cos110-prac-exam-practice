<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">after a = b; with the operator= that C++ writes</text><rect x="16" y="44" width="120" height="50" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="64" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">a  maxSize 3</text><text xml:space="preserve" x="24" y="84" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">items</text><rect x="16" y="230" width="120" height="50" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="250" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">b  maxSize 3</text><text xml:space="preserve" x="24" y="270" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">items</text><rect x="170" y="120" width="44" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="176" y="139" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><rect x="220" y="120" width="160" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="226" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Beef burger M R120</text><rect x="170" y="152" width="44" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="176" y="171" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><text xml:space="preserve" x="222" y="171" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><rect x="170" y="184" width="44" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="176" y="203" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><text xml:space="preserve" x="222" y="203" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><path d="M100,80 L150,80 L166,128" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><path d="M100,266 L150,266 L166,146" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="230" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d9480f" font-weight="bold" text-anchor="start">one array, two owners</text><text xml:space="preserve" x="16" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">a's old array and item:</text><rect x="16" y="342" width="44" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="22" y="361" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><rect x="66" y="342" width="130" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="72" y="361" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Soup  S R50</text><rect x="16" y="374" width="44" height="28" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="22" y="393" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><text xml:space="preserve" x="68" y="393" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="210" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d9480f" font-weight="normal" text-anchor="start">nothing points to them</text><text xml:space="preserve" x="210" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d9480f" font-weight="normal" text-anchor="start">any more (a leak)</text><text xml:space="preserve" x="16" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">a.items = b.items; copies only the address. At</text><text xml:space="preserve" x="16" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">the end, ~Menu() runs for b and then for a: the</text><text xml:space="preserve" x="16" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">same item and array are deleted twice.</text><text xml:space="preserve" x="16" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">valgrind: "Invalid read" and "Invalid free()".</text><text xml:space="preserve" x="16" y="524" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Adding an item to b also shows it in a.</text></svg>
