<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How an exception's message is built, one base class at a time</title><desc id="d">Step 1: NothingAboveMinimumValue() passes the text above minimum value to NothingMatchingFilter. Step 2: NothingMatchingFilter adds Nothing matching filter: in front and passes the result to Exception. Step 3: Exception stores it in msg. printException prints Exception: followed by msg.</desc><rect width="760" height="360" fill="#ffffff"/><text x="20" y="26" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">throw NothingAboveMinimumValue();</text>
<rect x="40" y="50" width="560" height="52" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="56" y="71" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">NothingAboveMinimumValue()</text>
<text x="56" y="90" text-anchor="start" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">: NothingMatchingFilter("above minimum value")</text>
<circle cx="28" cy="76" r="10" fill="#1d4ed8"/><text x="28" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" xml:space="preserve">1</text>
<line x1="80" y1="102" x2="112.70462795859915" y2="116.71708258136962" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="120.0,120.0 111.1,120.4 114.3,113.1" fill="#1d4ed8"/>
<rect x="80" y="120" width="560" height="52" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="96" y="141" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">NothingMatchingFilter(string filter)</text>
<text x="96" y="160" text-anchor="start" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">: Exception("Nothing matching filter: " + filter)</text>
<circle cx="68" cy="146" r="10" fill="#1d4ed8"/><text x="68" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" xml:space="preserve">2</text>
<line x1="120" y1="172" x2="152.70462795859916" y2="186.71708258136962" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="160.0,190.0 151.1,190.4 154.3,183.1" fill="#1d4ed8"/>
<rect x="120" y="190" width="560" height="52" fill="#fde68a" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="136" y="211" text-anchor="start" font-size="12" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Exception(string msg)</text>
<text x="136" y="230" text-anchor="start" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">: msg(msg)</text>
<circle cx="108" cy="216" r="10" fill="#1d4ed8"/><text x="108" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" xml:space="preserve">3</text>
<line x1="160" y1="242" x2="192.9902727305868" y2="260.14465000182275" stroke="#15803d" stroke-width="1.4"/><polygon points="200.0,264.0 191.1,263.6 194.9,256.6" fill="#15803d"/>
<rect x="160" y="264" width="520" height="34" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="176" y="286" text-anchor="start" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">msg = "Nothing matching filter: above minimum value"</text>
<text x="20" y="326" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">Each constructor passes a message to its own base class, after the colon. Only Exception stores it, because msg is private to Exception.</text>
<text x="20" y="344" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">e.printException() then prints:  Exception: Nothing matching filter: above minimum value</text></svg>
