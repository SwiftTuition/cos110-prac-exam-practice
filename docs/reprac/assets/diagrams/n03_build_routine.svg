<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="16" y="12" width="410" height="44" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="41" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">1  Read the question, the headers, main.cpp</text><path d="M216,56 L216,74" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="76" width="410" height="44" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">2  Copy the header line; add ClassName::</text><path d="M216,120 L216,138" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="140" width="410" height="44" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="169" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">3  A body that only returns; build it</text><path d="M216,184 L216,202" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="204" width="410" height="44" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="233" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">4  Special cases first: NULL, empty, invalid</text><path d="M216,248 L216,266" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="268" width="410" height="44" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="297" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">5  The normal case; check where loops end</text><path d="M216,312 L216,330" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="332" width="410" height="44" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">6  Memory: one delete for each new</text><path d="M216,376 L216,394" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="396" width="410" height="44" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="normal" text-anchor="start">7  Build; compare output; read first error</text><path d="M426,418 L456,418 L456,290 L430,290" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><text xml:space="preserve" x="462" y="342" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">fix,</text><text xml:space="preserve" x="462" y="362" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">build</text><text xml:space="preserve" x="462" y="382" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">again</text><text xml:space="preserve" x="16" y="476" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" font-weight="normal" text-anchor="start">Shaded: the steps that give a file that builds.</text><text xml:space="preserve" x="16" y="504" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">Assumed (from the HRMS practical): you build with</text><text xml:space="preserve" x="16" y="526" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9480f" font-weight="bold" text-anchor="start">make, which runs g++ -Wall -Werror and then valgrind.</text></svg>
