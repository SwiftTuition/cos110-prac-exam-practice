<svg xmlns="http://www.w3.org/2000/svg" width="480" height="860" viewBox="0 0 480 860"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Section B partial UML, one class at a time</text><rect x="16" y="40" width="410" height="210" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="70" x2="426" y2="70" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="120" x2="426" y2="120" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="221.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">Binary</text><text xml:space="preserve" x="24" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- array: bool*</text><text xml:space="preserve" x="24" y="110" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- size: int</text><text xml:space="preserve" x="24" y="140" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Binary(string)</text><text xml:space="preserve" x="24" y="160" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Binary(const Binary&amp;)</text><text xml:space="preserve" x="24" y="180" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ ~Binary()</text><text xml:space="preserve" x="24" y="200" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ operator[](int): bool&amp;</text><text xml:space="preserve" x="24" y="220" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ operator[](int): const bool&amp;</text><text xml:space="preserve" x="24" y="240" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getSize(): int</text><circle cx="448" cy="85" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><circle cx="448" cy="135" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><circle cx="448" cy="195" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><circle cx="448" cy="215" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><circle cx="448" cy="235" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text xml:space="preserve" x="16" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">A plain line joins Binary to BinaryStrings.</text><rect x="16" y="288" width="410" height="190" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="318" x2="426" y2="318" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="368" x2="426" y2="368" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="221.0" y="309" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">BinaryStrings</text><text xml:space="preserve" x="24" y="338" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- head: Node&lt;Binary&gt;*</text><text xml:space="preserve" x="24" y="358" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- size: int</text><text xml:space="preserve" x="24" y="388" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ BinaryStrings()</text><text xml:space="preserve" x="24" y="408" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ ~BinaryStrings()</text><text xml:space="preserve" x="24" y="428" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ prepend(const Binary&amp;): void</text><text xml:space="preserve" x="24" y="448" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getHead(): Node&lt;Binary&gt;*&amp;</text><text xml:space="preserve" x="24" y="468" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ calculatePos(): int</text><circle cx="448" cy="403" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><circle cx="448" cy="423" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><circle cx="448" cy="463" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text xml:space="preserve" x="16" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">A plain line joins BinaryStrings to Node.</text><rect x="16" y="528" width="410" height="170" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="558" x2="426" y2="558" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="608" x2="426" y2="608" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="221.0" y="549" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">Node</text><text xml:space="preserve" x="24" y="578" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- data: T</text><text xml:space="preserve" x="24" y="598" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- nextNode: Node&lt;T&gt;*</text><text xml:space="preserve" x="24" y="628" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Node(T)</text><text xml:space="preserve" x="24" y="648" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ ~Node()</text><text xml:space="preserve" x="24" y="668" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getData(): T&amp;</text><text xml:space="preserve" x="24" y="688" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ next(): Node&lt;T&gt;*&amp;</text><rect x="392" y="514" width="44" height="24" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="414" y="531" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="middle">T</text><circle cx="448" cy="573" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="578" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><circle cx="448" cy="643" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="648" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text xml:space="preserve" x="16" y="724" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">nextNode points to another Node&lt;T&gt;.</text><text xml:space="preserve" x="16" y="745" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Dashed box with T: Node is a template.</text><text xml:space="preserve" x="16" y="766" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">In Node&lt;Binary&gt;, T is Binary: each node holds</text><text xml:space="preserve" x="16" y="787" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">a whole Binary object (data: T, not T*).</text><text xml:space="preserve" x="16" y="808" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Not drawn: operator&lt;&lt; for Binary and</text><text xml:space="preserve" x="16" y="829" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">BinaryStrings (each class has one).</text></svg>
