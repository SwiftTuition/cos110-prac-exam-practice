<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">operator+ puts the item in the first NULL slot, or deletes it</title><desc id="d">Top: a menu of 3 slots holding Soup, then two NULL slots. The loop skips slot 0 and stores the new item in slot 1, then returns. Bottom: a full menu of 3 items. No slot is NULL, so after the loop the new item is deleted.</desc><rect width="900" height="300" fill="#ffffff"/><text x="20" y="26" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">menu + new Item('D', "Lemon tart", 55);</text>
<text x="20" y="76" text-anchor="start" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">Menu(3) with one item:</text>
<rect x="200" y="60" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="260.0" y="54" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[0]</text>
<text x="260.0" y="84.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Soup</text>
<rect x="320" y="60" width="120" height="40" fill="#fde68a" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="380.0" y="54" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[1]</text>
<text x="380.0" y="84.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">NULL</text>
<rect x="440" y="60" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="500.0" y="54" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[2]</text>
<text x="500.0" y="84.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">NULL</text>
<text x="580" y="74" text-anchor="start" font-size="12" fill="#1f2937" xml:space="preserve">i = 0: not NULL, continue</text>
<text x="580" y="92" text-anchor="start" font-size="12" font-weight="bold" fill="#1d4ed8" xml:space="preserve">i = 1: NULL, store here, return *this</text>
<line x1="380.0" y1="124" x2="380.0" y2="110.0" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="380.0,102.0 384.0,110.0 376.0,110.0" fill="#1d4ed8"/>
<text x="380.0" y="140" text-anchor="middle" font-size="12" fill="#1d4ed8" xml:space="preserve">Lemon tart goes here</text>
<text x="20" y="192" text-anchor="start" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">Full Menu(3):</text>
<rect x="200" y="176" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="260.0" y="170" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[0]</text>
<text x="260.0" y="200.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Soup</text>
<rect x="320" y="176" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="380.0" y="170" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[1]</text>
<text x="380.0" y="200.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Burger</text>
<rect x="440" y="176" width="120" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="500.0" y="170" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[2]</text>
<text x="500.0" y="200.0" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Curry</text>
<text x="580" y="190" text-anchor="start" font-size="12" fill="#1f2937" xml:space="preserve">i = 0, 1, 2: no NULL slot</text>
<text x="580" y="208" text-anchor="start" font-size="12" font-weight="bold" fill="#b91c1c" xml:space="preserve">loop ends: delete item; return *this</text>
<rect x="260" y="234" width="112" height="46" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" rx="3" stroke-dasharray="5 4"/>
<text x="316.0" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#9ca3af" xml:space="preserve">Lemon tart</text>
<text x="316.0" y="270" text-anchor="middle" font-size="11" fill="#9ca3af" xml:space="preserve">deleted</text>
<text x="380" y="262" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">nothing else would free it, so operator+ deletes it</text></svg>
