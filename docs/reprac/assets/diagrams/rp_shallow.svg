<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">The operator= that C++ writes copies the items pointer, not the items</title><desc id="d">After a = b with the compiler's operator=, a.items and b.items both point to b's array, whose slot 0 points to Beef burger. a's old array and its Soup item are drawn dashed: nothing points to them, so they leak.</desc><rect width="1060" height="340" fill="#ffffff"/><text x="30" y="42" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">a</text>
