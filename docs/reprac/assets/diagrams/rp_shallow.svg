<text x="30" y="300" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">a.items = b.items; copies only the address. At the end, ~Menu() runs for b and then for a: the same item and array are deleted twice.</text>
<text x="30" y="320" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">valgrind: "Invalid read" and "Invalid free()". Adding an item to b also shows it in a.</text></svg>
