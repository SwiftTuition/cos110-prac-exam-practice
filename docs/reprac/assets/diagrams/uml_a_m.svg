r="start">StarterNotFound</text><text xml:space="preserve" x="82" y="1089" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ StarterNotFound()</text><path d="M60,1116 L51,1130 L69,1130 z" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><rect x="74" y="1108" width="326" height="48" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="82" y="1127" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">MainNotFound</text><text xml:space="preserve" x="82" y="1147" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ MainNotFound()</text><path d="M60,1174 L51,1188 L69,1188 z" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><rect x="74" y="1166" width="326" height="48" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="82" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">DessertNotFound</text><text xml:space="preserve" x="82" y="1205" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ DessertNotFound()</text><text xml:space="preserve" x="16" y="1228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">Indented: derived from the class above it.</text><text xml:space="preserve" x="16" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Orange numbers: the numbered list under the</text><text xml:space="preserve" x="16" y="1275" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">diagram.</text><text xml:space="preserve" x="16" y="1296" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Assumed: Menu uses Item objects, and its</text><text xml:space="preserve" x="16" y="1317" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">functions throw the exception classes.</text><text xml:space="preserve" x="16" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Not drawn: each class has a friend operator&lt;&lt;</text><text xml:space="preserve" x="16" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">(the paper says so). The exam's own headers</text><text xml:space="preserve" x="16" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">show virtual and const.</text></svg>
