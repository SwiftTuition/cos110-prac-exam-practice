.</text><rect x="16" y="366" width="410" height="230" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="396" x2="426" y2="396" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="466" x2="426" y2="466" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="221.0" y="387" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">Item</text><text xml:space="preserve" x="24" y="416" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- type: char</text><text xml:space="preserve" x="24" y="436" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- name: string</text><text xml:space="preserve" x="24" y="456" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- price: float</text><text xml:space="preserve" x="24" y="486" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Item(char, string, float)</text><text xml:space="preserve" x="24" y="506" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Item(const Item&amp;)</text><text xml:space="preserve" x="24" y="526" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ ~Item()</text><text xml:space="preserve" x="24" y="546" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getType(): char</text><text xml:space="preserve" x="24" y="566" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getName(): string</text><text xml:space="preserve" x="24" y="586" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ getPrice(): string</text><circle cx="448" cy="411" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><circle cx="448" cy="541" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><circle cx="448" cy="561" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><circle cx="448" cy="581" r="11" fill="#d9480f"/><text xml:space="preserve" x="448" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><circle cx="412" cy="581" r="11" fill="#d9480f"/><text xml:space="preserve" x="412" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><rect x="16" y="620" width="410" height="110" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="650" x2="426" y2="650" stroke="#1f2933" stroke-width="1.6"/><line x1="16" y1="680" x2="426" y2="680" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="221.0" y="641" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">Exception</text><text xml:space="preserve" x="24" y="670" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">- msg: string</text><text xml:space="preserve" x="24" y="700" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">+ Exception(string)</text><text xml:space=