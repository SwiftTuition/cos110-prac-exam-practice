<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">insertAt(Binary("10"), 1) on 01 -&gt; 11</text><text xml:space="preserve" x="16" y="78" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">head</text><path d="M56,73 L90,73" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="92" y="53" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="147" y="53" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="119.5" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">01</text><circle cx="164.5" cy="73" r="3.5" fill="#1f2933"/><rect x="302" y="53" width="55" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><rect x="357" y="53" width="35" height="40" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="329.5" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">11</text><circle cx="374.5" cy="73" r="3.5" fill="#1f2933"/><text xml:space="preserve" x="408" y="78" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><path d="M392,73 L404,73" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><path d="M166,73 L300,73" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah-grey)"/><line x1="227" y1="66" x2="241" y2="80" stroke="#d9480f" stroke-width="2.4"/><line x1="227" y1="80" x2="241" y2="66" stroke="#d9480f" stroke-width="2.4"/><text xml:space="preserve" x="108" y="124" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">prev</text><path d="M126,110 L126,96" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="196" y="160" width="55" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><rect x="251" y="160" width="35" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="223.5" y="185" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">10</text><circle cx="268.5" cy="180" r="3.5" fill="#1f2933"/><text xml:space="preserve" x="196" y="226" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">newNode</text><path d="M270,180 L330,180 L346,96" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="330" cy="150" r="11" fill="#d9480f"/><text xml:space="preserve" x="330" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><path d="M166,80 L186,140 L204,160" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="170" cy="130" r="11" fill="#d9480f"/><text xml:space="preserve" x="170" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text xml:space="preserve" x="16" y="280" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1: newNode-&gt;next() = prev-&gt;next();</text><text xml:space="preserve" x="16" y="301" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2: prev-&gt;next() = newNode;</text><text xml:space="preserve" x="16" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Red cross: the old link from 01 to 11, which</text><text xml:space="preserve" x="16" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">step 2 replaces.</text><text xml:space="preserve" x="16" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Order matters: if step 2 ran first, nothing</text><text xml:space="preserve" x="16" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">would point to 11, and the rest of the list</text><text xml:space="preserve" x="16" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">would be lost.</text></svg>
