<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">A Binary object and a BinaryStrings list in memory</title><desc id="d">Binary a("1101") has size 4 and an array pointer to four bools: true, true, false, true. Below, a BinaryStrings list: head points to a node holding the Binary 000, which points to a node holding the Binary 0011, which points to NULL.</desc><rect width="960" height="270" fill="#ffffff"/><text x="30" y="28" text-anchor="start" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">Binary a("1101");</text>
<rect x="30" y="45" width="210" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<line x1="135" y1="45" x2="135" y2="85" stroke="#1f2937" stroke-width="1.3"/>
<text x="82" y="70" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">size 4</text>
<text x="170" y="70" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">array</text>
<circle cx="215" cy="65" r="3.5" fill="#1f2937"/>
<rect x="290" y="45" width="70" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="325" y="39" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[0]</text>
<text x="325" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">true</text>
<rect x="360" y="45" width="70" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="395" y="39" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[1]</text>
<text x="395" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">true</text>
<rect x="430" y="45" width="70" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="465" y="39" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[2]</text>
<text x="465" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">false</text>
<rect x="500" y="45" width="70" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<text x="535" y="39" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">[3]</text>
<text x="535" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937" xml:space="preserve">true</text>
<line x1="215" y1="65" x2="280.0" y2="65.0" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="288.0,65.0 280.0,69.0 280.0,61.0" fill="#1d4ed8"/>
<text x="30" y="112" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">new bool[4] made the array. cout &lt;&lt; a prints 1101. ~Binary() does delete[] array;</text>
<text x="30" y="160" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937" xml:space="preserve">BinaryStrings after prepend("0011") and then prepend("000"):</text>
<rect x="30" y="180" width="120" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<line x1="95" y1="180" x2="95" y2="220" stroke="#1f2937" stroke-width="1.3"/>
<text x="62" y="205" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">head</text>
<circle cx="122" cy="200" r="3.5" fill="#1f2937"/>
<rect x="200" y="180" width="220" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<line x1="370" y1="180" x2="370" y2="220" stroke="#1f2937" stroke-width="1.3"/>
<text x="285" y="205" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">data: Binary 000</text>
<circle cx="395" cy="200" r="3.5" fill="#1f2937"/>
<line x1="122" y1="200" x2="190.0" y2="200.0" stroke="#1d4ed8" stroke-width="1.4"/><polygon points="198.0,200.0 190.0,204.0 190.0,196.0" fill="#1d4ed8"/>
<rect x="500" y="180" width="220" height="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4" rx="3"/>
<line x1="670" y1="180" x2="670" y2="220" stroke="#1f2937" stroke-width="1.3"/>
<text x="585" y="205" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2937" xml:space="preserve">data: Binary 0011</text>
<circle cx="695" cy="200" r="3.5" fill="#1f2937"/>
<line x1="415" y1="200" x2="490.0" y2="200.0" stroke="#1f2937" stroke-width="1.4"/><polygon points="498.0,200.0 490.0,204.0 490.0,196.0" fill="#1f2937"/>
<line x1="695" y1="200" x2="762.0" y2="200.0" stroke="#1f2937" stroke-width="1.4"/><polygon points="770.0,200.0 762.0,204.0 762.0,196.0" fill="#1f2937"/>
<text x="775" y="205" text-anchor="start" font-size="12" font-family="Consolas, Menlo, monospace" fill="#4b5563" xml:space="preserve">NULL</text>
<text x="30" y="250" text-anchor="start" font-size="12" fill="#4b5563" xml:space="preserve">Each node holds a whole Binary (data: T), made with the Binary copy constructor. Deleting a node runs ~Node, then destroys its data, which runs ~Binary.</text></svg>
