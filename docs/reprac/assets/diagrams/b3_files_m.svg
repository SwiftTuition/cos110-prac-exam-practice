<svg xmlns="http://www.w3.org/2000/svg" width="480" height="859" viewBox="0 0 480 859"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Where each piece of a B_3 answer is written</text><text xml:space="preserve" x="16" y="48" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Function template</text><rect x="16" y="58" width="448" height="74" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="78" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Templates.h</text><text xml:space="preserve" x="24" y="100" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">general template</text><text xml:space="preserve" x="24" y="119" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">template &lt;&gt; declaration</text><path d="M120,162 L120,134" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="130" y="154" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">#include</text><rect x="16" y="164" width="448" height="74" rx="4" fill="#fff4c2" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="184" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">B_3.cpp  (compiled on its own)</text><text xml:space="preserve" x="24" y="206" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">template &lt;&gt; ... name&lt;Binary&gt;(...)</text><text xml:space="preserve" x="24" y="225" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">{ body }</text><text xml:space="preserve" x="16" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Member of Node&lt;T&gt;</text><rect x="16" y="290" width="448" height="74" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="310" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Node.h</text><text xml:space="preserve" x="24" y="332" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">class Node, #include "Node.cpp",</text><text xml:space="preserve" x="24" y="351" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">template &lt;&gt; declaration</text><path d="M120,394 L120,366" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="130" y="386" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">#include</text><rect x="16" y="396" width="448" height="74" rx="4" fill="#fff4c2" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="416" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">B_3.cpp  (compiled on its own)</text><text xml:space="preserve" x="24" y="438" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">template &lt;&gt;</text><text xml:space="preserve" x="24" y="457" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">int Node&lt;Binary&gt;::toInt() { }</text><text xml:space="preserve" x="16" y="512" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Header includes B_3.cpp</text><rect x="16" y="522" width="448" height="74" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="542" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Templates.h</text><text xml:space="preserve" x="24" y="564" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">general, declaration,</text><text xml:space="preserve" x="24" y="583" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">#include "B_3.cpp"</text><path d="M120,626 L120,598" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="130" y="618" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#52606d" font-weight="normal" text-anchor="start">#include</text><path d="M330,598 L330,626" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><text xml:space="preserve" x="340" y="618" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#d9480f" font-weight="normal" text-anchor="start">#include</text><rect x="16" y="628" width="448" height="74" rx="4" fill="#fff4c2" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="648" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">B_3.cpp  (include guard)</text><text xml:space="preserve" x="24" y="670" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">template &lt;&gt; inline ...</text><text xml:space="preserve" x="24" y="689" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">{ body }</text><text xml:space="preserve" x="16" y="744" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Yellow: your answer file. Blue: B_3.cpp includes</text><text xml:space="preserve" x="16" y="765" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">the header. Orange: the header also includes</text><text xml:space="preserve" x="16" y="786" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">B_3.cpp, so the body is compiled twice and needs</text><text xml:space="preserve" x="16" y="807" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">inline; the include guard stops it being read</text><text xml:space="preserve" x="16" y="828" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">twice in one file.</text></svg>
