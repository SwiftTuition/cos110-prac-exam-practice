<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Menu b(4);</text><rect x="16" y="40" width="150" height="64" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">maxSize 4</text><text xml:space="preserve" x="26" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">items</text><path d="M90,86 L196,86" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="200" y="70" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><path d="M250,85 L288,85" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="290" y="66" width="174" height="38" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="298" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Garlic bread</text><text xml:space="preserve" x="298" y="99" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">S  R45.5</text><rect x="200" y="114" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208" y="134" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><path d="M250,129 L288,129" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="290" y="110" width="174" height="38" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="298" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Beef burger</text><text xml:space="preserve" x="298" y="143" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">M  R120</text><rect x="200" y="158" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208" y="178" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><path d="M250,173 L288,173" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="290" y="154" width="174" height="38" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="298" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Malva pudding</text><text xml:space="preserve" x="298" y="187" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">D  R60</text><rect x="200" y="202" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="208" y="222" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[3]</text><text xml:space="preserve" x="262" y="222" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="16" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">b itself (maxSize and the items pointer) is a</text><text xml:space="preserve" x="16" y="301" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">normal variable. new Item*[4] made the array of</text><text xml:space="preserve" x="16" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">4 pointers; each new Item(...) made one item.</text><text xml:space="preserve" x="16" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">~Menu() frees both levels: delete items[i] for</text><text xml:space="preserve" x="16" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">each slot (delete NULL does nothing), then</text><text xml:space="preserve" x="16" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">delete[] items.</text></svg>
