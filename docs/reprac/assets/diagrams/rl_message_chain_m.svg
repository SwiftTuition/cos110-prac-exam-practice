<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">throw NothingAboveMinimumValue();</text><rect x="16" y="44" width="448" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="66" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">NothingAboveMinimumValue()</text><text xml:space="preserve" x="26" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">: NothingMatchingFilter("above minimum value")</text><path d="M240,110 L240,136" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="262" cy="124" r="11" fill="#d9480f"/><text xml:space="preserve" x="262" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><rect x="16" y="140" width="448" height="86" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="162" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">NothingMatchingFilter(string filter)</text><text xml:space="preserve" x="26" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">: Exception("Nothing matching filter: "</text><text xml:space="preserve" x="26" y="202" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">            + filter)</text><path d="M240,226 L240,252" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="262" cy="240" r="11" fill="#d9480f"/><text xml:space="preserve" x="262" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><rect x="16" y="256" width="448" height="66" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="278" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Exception(string msg)</text><text xml:space="preserve" x="26" y="298" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">: msg(msg)</text><path d="M240,322 L240,348" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="262" cy="336" r="11" fill="#d9480f"/><text xml:space="preserve" x="262" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><rect x="16" y="352" width="448" height="50" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="372" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">msg = "Nothing matching filter:</text><text xml:space="preserve" x="26" y="392" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">       above minimum value"</text><text xml:space="preserve" x="16" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Each constructor passes a message to its own</text><text xml:space="preserve" x="16" y="453" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">base class, after the colon. Only Exception</text><text xml:space="preserve" x="16" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">stores it, because msg is private to Exception.</text><text xml:space="preserve" x="16" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">e.printException() then prints:</text><text xml:space="preserve" x="16" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Exception: Nothing matching filter: above</text><text xml:space="preserve" x="16" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">minimum value</text></svg>
