x="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="428" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Malva pudding</text><text xml:space="preserve" x="16" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">old items (2 slots)</text><rect x="16" y="76" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="24" y="96.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><path d="M66,91 L418,104" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah-grey)"/><rect x="16" y="110" width="50" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="24" y="130.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><path d="M66,125 L418,164" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah-grey)"/><line x1="34" y1="103" x2="48" y2="117" stroke="#d9480f" stroke-width="2.4"/><line x1="34" y1="117" x2="48" y2="103" stroke="#d9480f" stroke-width="2.4"/><text xml:space="preserve" x="16" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d9480f" font-weight="bold" text-anchor="start">freed at step 4</text><text xml:space="preserve" x="16" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">bigger (3 slots)</text><rect x="16" y="210" width="50" height="30" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="230.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><path d="M66,225 L418,108" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="16" y="244" width="50" height="30" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="264.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><path d="M66,259 L418,168" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="16" y="278" width="50" height="30" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="298.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><path d="M66,293 L418,248" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><text xml:space="preserve" x="16" y="340" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1: bigger = new Item*[3];</text><text xml:space="preserve" x="16" y="361" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">2: i = 0, 1: bigger[i] = items[i];</text><text xml:space="preserve" x="16" y="382" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">   (2 &lt; 2 is false: the loop ends)</text><text xml:space="preserve" x="340" y="340" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">3: bigger[2] = item;</text><text xml:space="preserve" x="340" y="361" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">4: delete[] items;  frees the old array</text><text xml:space="preserve" x="340" y="382" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">   of pointers only; the items stay</text><text xml:space="preserve" x="340" y="403" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">5: items = bigger;  maxSize++ (now 3)</text><text xml:space="preserve" x="16" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">Blue: copied pointers. Orange: the new item. Dashed: the old array, freed at step 4.</text></svg>
