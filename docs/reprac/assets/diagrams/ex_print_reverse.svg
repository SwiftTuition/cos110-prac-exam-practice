<svg xmlns="http://www.w3.org/2000/svg" width="640" height="453" viewBox="0 0 640 453"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(head) on 000 -&gt; 0011 -&gt; 1101 -&gt; 0101</text><rect x="16" y="44" width="512" height="46" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="73" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(000)</text><text xml:space="preserve" x="520" y="73" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="end">then prints 000: 4th</text><path d="M56,90 L80,108" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="40" y="110" width="512" height="46" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="48" y="139" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(0011)</text><text xml:space="preserve" x="544" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="end">then prints 0011: 3rd</text><path d="M80,156 L104,174" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="64" y="176" width="512" height="46" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="72" y="205" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(1101)</text><text xml:space="preserve" x="568" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="end">then prints 1101: 2nd</text><path d="M104,222 L128,240" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="88" y="242" width="512" height="46" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="96" y="271" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(0101)</text><text xml:space="preserve" x="592" y="271" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="end">then prints 0101: 1st</text><path d="M128,288 L152,306" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="112" y="308" width="512" height="46" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="120" y="337" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">printReverse(NULL)</text><text xml:space="preserve" x="616" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="end">returns, prints nothing</text><text xml:space="preserve" x="16" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Blue: going down, each call first calls the next node.</text><text xml:space="preserve" x="16" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Green: coming back up, each call prints its own node.</text><text xml:space="preserve" x="16" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Output: 0101, 1101, 0011, 000.</text></svg>
