<svg xmlns="http://www.w3.org/2000/svg" width="400" height="358" viewBox="0 0 400 358"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">findLast("Main") on mainsOnly</text><text xml:space="preserve" x="16" y="46" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">Menu(3): maxSize is 3, so the slots are [0], [1], [2]</text><text xml:space="preserve" x="22" y="76" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[0]</text><rect x="16" y="84" width="116" height="30" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="104.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Beef burger  M</text><text xml:space="preserve" x="16" y="140" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">i = 0: type M</text><text xml:space="preserve" x="16" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">a match: returns</text><text xml:space="preserve" x="16" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">a copy</text><text xml:space="preserve" x="146" y="76" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[1]</text><rect x="140" y="84" width="116" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="148" y="104.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="140" y="140" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">i = 1: NULL</text><text xml:space="preserve" x="140" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="start">no match</text><text xml:space="preserve" x="270" y="76" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[2]</text><rect x="264" y="84" width="116" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="272" y="104.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="264" y="140" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">i = 2: NULL</text><text xml:space="preserve" x="264" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d" font-weight="bold" text-anchor="start">no match</text><path d="M322.0,206 L202.0,206" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="260.0" cy="222" r="11" fill="#d9480f"/><text xml:space="preserve" x="260.0" y="227" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><path d="M198.0,206 L78.0,206" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#ah-orange)"/><circle cx="136.0" cy="222" r="11" fill="#d9480f"/><text xml:space="preserve" x="136.0" y="227" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text xml:space="preserve" x="16" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Pass 1 is i = 2 (maxSize - 1); the arrows show i--.</text><text xml:space="preserve" x="16" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">i = 0 matches, so the function returns before</text><text xml:space="preserve" x="16" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">i = -1, where i &gt;= 0 would be false.</text><text xml:space="preserve" x="16" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[3] does not exist: starting at i = maxSize</text><text xml:space="preserve" x="16" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">would read past the end of the array.</text></svg>
