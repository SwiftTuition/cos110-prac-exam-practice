<svg xmlns="http://www.w3.org/2000/svg" width="520" height="616" viewBox="0 0 520 616"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="16" y="16" width="488" height="40" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="43" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">You write:  menu + item</text><path d="M60,58 L60,78" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="80" width="488" height="40" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="107" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">C++ calls:  menu.operator+(item)</text><text xml:space="preserve" x="16" y="144" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" font-weight="normal" text-anchor="start">member: the left side is *this, the right side the parameter</text><rect x="16" y="166" width="488" height="40" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="193" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">You write:  b[2]</text><path d="M60,208 L60,228" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="230" width="488" height="40" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="257" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">C++ calls:  b.operator[](2)</text><text xml:space="preserve" x="16" y="294" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" font-weight="normal" text-anchor="start">member: the index is the parameter</text><rect x="16" y="316" width="488" height="40" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="343" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">You write:  a = b</text><path d="M60,358 L60,378" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="380" width="488" height="40" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="407" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">C++ calls:  a.operator=(b)</text><text xml:space="preserve" x="16" y="444" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" font-weight="normal" text-anchor="start">member: a already exists; b is the parameter</text><rect x="16" y="466" width="488" height="40" rx="4" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="493" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">You write:  cout &lt;&lt; menu</text><path d="M60,508 L60,528" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="16" y="530" width="488" height="40" rx="4" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="28" y="557" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#1f2933" font-weight="normal" text-anchor="start">C++ calls:  operator&lt;&lt;(cout, menu)</text><text xml:space="preserve" x="16" y="594" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52606d" font-weight="normal" text-anchor="start">friend, not a member: both sides are parameters</text></svg>
