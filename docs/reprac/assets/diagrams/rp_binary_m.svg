<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Binary a("1101");</text><rect x="16" y="40" width="120" height="64" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="26" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">size 4</text><text xml:space="preserve" x="26" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">array</text><path d="M80,86 L150,86" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><text xml:space="preserve" x="172" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[0]</text><rect x="152" y="70" width="74" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="160" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">true</text><text xml:space="preserve" x="250" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[1]</text><rect x="230" y="70" width="74" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="238" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">true</text><text xml:space="preserve" x="328" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[2]</text><rect x="308" y="70" width="74" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="316" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">false</text><text xml:space="preserve" x="406" y="62" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">[3]</text><rect x="386" y="70" width="74" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="394" y="90" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">true</text><text xml:space="preserve" x="16" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">new bool[4] made the array. cout &lt;&lt; a prints</text><text xml:space="preserve" x="16" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">1101. ~Binary() does delete[] array;</text><text xml:space="preserve" x="16" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">BinaryStrings after prepend("0011") and</text><text xml:space="preserve" x="16" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">then prepend("000"):</text><text xml:space="preserve" x="16" y="262" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6b3fa0" font-weight="bold" text-anchor="start">head</text><path d="M56,257 L90,257" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-ptr)"/><rect x="92" y="238" width="230" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="100" y="263" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">data: Binary 000</text><path d="M206,278 L206,306" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="92" y="308" width="230" height="40" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="100" y="333" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">data: Binary 0011</text><path d="M206,348 L206,376" fill="none" stroke="#1d5fbf" stroke-width="2" marker-end="url(#ah-blue)"/><text xml:space="preserve" x="186" y="396" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#52606d" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="16" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Each node holds a whole Binary (data: T), made</text><text xml:space="preserve" x="16" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">with the Binary copy constructor. Deleting a</text><text xml:space="preserve" x="16" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">node runs ~Node, then destroys its data, which</text><text xml:space="preserve" x="16" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">runs ~Binary.</text></svg>
