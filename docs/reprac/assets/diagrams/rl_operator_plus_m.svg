<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520"><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fbf"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4b"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><marker id="ah-ptr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text xml:space="preserve" x="16" y="24" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">menu + new Item('D', "Lemon tart", 55);</text><text xml:space="preserve" x="16" y="54" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Menu(3) with one item:</text><rect x="16" y="66" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="86" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><rect x="62" y="66" width="110" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="86" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Soup</text><text xml:space="preserve" x="184" y="86" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">i = 0: not NULL, continue</text><rect x="16" y="104" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="124" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><rect x="62" y="104" width="110" height="30" rx="0" fill="#fff1e6" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="124" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="184" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">i = 1: NULL, store here,</text><rect x="16" y="142" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="162" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><rect x="62" y="142" width="110" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="162" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">NULL</text><text xml:space="preserve" x="184" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start"></text><text xml:space="preserve" x="184" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">return *this</text><text xml:space="preserve" x="62" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1b7f4b" font-weight="bold" text-anchor="start">Lemon tart goes in slot 1</text><text xml:space="preserve" x="16" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="start">Full Menu(3):</text><rect x="16" y="252" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="272" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[0]</text><rect x="62" y="252" width="110" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="272" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Soup</text><rect x="16" y="290" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="310" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[1]</text><rect x="62" y="290" width="110" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="310" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Burger</text><rect x="16" y="328" width="46" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="24" y="348" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">[2]</text><rect x="62" y="328" width="110" height="30" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6"/><text xml:space="preserve" x="70" y="348" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Curry</text><text xml:space="preserve" x="184" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">i = 0, 1, 2: no NULL slot</text><text xml:space="preserve" x="184" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">loop ends: delete item;</text><text xml:space="preserve" x="184" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">return *this</text><rect x="16" y="380" width="160" height="34" rx="0" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.6" stroke-dasharray="5,3"/><text xml:space="preserve" x="26" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">Lemon tart</text><line x1="143" y1="390" x2="157" y2="404" stroke="#d9480f" stroke-width="2.4"/><line x1="143" y1="404" x2="157" y2="390" stroke="#d9480f" stroke-width="2.4"/><text xml:space="preserve" x="190" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d9480f" font-weight="bold" text-anchor="start">deleted</text><text xml:space="preserve" x="16" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">nothing else would free it, so operator+</text><text xml:space="preserve" x="16" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2933" font-weight="normal" text-anchor="start">deletes it</text></svg>
