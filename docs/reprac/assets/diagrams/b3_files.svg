<text x="20" y="420" text-anchor="start" font-size="15" fill="#4b5563" xml:space="preserve">Yellow: your answer file. Blue: B_3.cpp includes the header. Orange: the header also includes B_3.cpp,</text>
<text x="20" y="444" text-anchor="start" font-size="15" fill="#4b5563" xml:space="preserve">so the body is compiled twice and needs inline; the include guard stops it being read twice in one file.</text></svg>
